<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Setup', ~{::body-content})}">
<body>
<th:block th:fragment="body-content">

    <h2>Setup</h2>
    <div class="notice" th:if="${ready}">Everything needed is in place. You can generate.</div>
    <div class="notice error" th:unless="${ready}"
         th:text="${#lists.size(blockers)} + ' thing(s) need fixing before generation will work.'"></div>

    <div class="card">
        <table class="checks">
            <tr th:each="check : ${checks}" th:classappend="${check.status().name().toLowerCase()}">
                <td class="mark" th:switch="${check.status().name()}">
                    <span th:case="'OK'" title="ready">OK</span>
                    <span th:case="'WARN'" title="worth knowing">!</span>
                    <span th:case="*" title="blocking">FAIL</span>
                </td>
                <td class="name" th:text="${check.name()}">Check</td>
                <td>
                    <div th:text="${check.detail()}">detail</div>
                    <div class="muted fix" th:if="${check.fix()}" th:text="${check.fix()}">fix</div>
                </td>
            </tr>
        </table>
    </div>

    <p class="muted">API keys are read from the environment and never stored by this tool, so only their
        presence and length are shown. The same checks are available on the command line with
        <span class="pill">--doctor</span>.</p>

</th:block>
</body>
</html>
