<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Items', ~{::body-content})}">
<body>
<th:block th:fragment="body-content">
    <h2>Items</h2>
    <div class="card">
        <form method="get" th:action="@{/items}" class="inline">
            <div>
                <label for="topic">Topic</label>
                <select id="topic" name="topic" style="min-width:18rem">
                    <option value="">all</option>
                    <option th:each="t : ${topics}" th:value="${t.key()}" th:text="${t.key()}"
                            th:selected="${t.key() == selectedTopic}"></option>
                </select>
            </div>
            <div>
                <label for="accepted">Decision</label>
                <select id="accepted" name="accepted">
                    <option value="">all</option>
                    <option value="true" th:selected="${selectedAccepted == true}">accepted</option>
                    <option value="false" th:selected="${selectedAccepted == false}">rejected</option>
                </select>
            </div>
            <button type="submit">Filter</button>
        </form>
    </div>

    <div class="card">
        <p class="muted" th:if="${#lists.isEmpty(items)}">No items yet. Generate some from the dashboard.</p>
        <table th:unless="${#lists.isEmpty(items)}">
            <tr><th>Title</th><th>Topic</th><th>Score</th><th>Decision</th><th>Answers</th><th>State</th></tr>
            <tr th:each="i : ${items}">
                <td><a th:href="@{'/items/' + ${i.id()}}" th:text="${i.title()} ?: '(untitled)'"></a></td>
                <td class="muted" th:text="${i.topicKey()}"></td>
                <td th:text="${i.aggregateScore() != null} ? ${#numbers.formatDecimal(i.aggregateScore(),1,2)} : '—'"></td>
                <td>
                    <span th:if="${i.accepted() == true}" class="ok">accepted</span>
                    <span th:if="${i.accepted() == false}" class="bad">rejected</span>
                    <span th:if="${i.accepted() == null}" class="muted">unjudged</span>
                </td>
                <td class="muted" th:text="${i.attempts()}"></td>
                <td class="muted" th:text="${i.state()}"></td>
            </tr>
        </table>
    </div>
</th:block>
</body>
</html>
