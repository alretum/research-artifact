<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, body)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'MCQ pipeline — ' + ${title}">MCQ pipeline</title>
    <link rel="stylesheet" th:href="@{/app.css}">
    <!-- Generated questions carry LaTeX in the notations models emit: \(..\), \[..\], $..$ and $$..$$.
         Rendering needs the CDN to be reachable; without a network the raw notation is shown unchanged. -->
    <script th:inline="none">
        window.MathJax = {tex: {inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true}};
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
<header>
    <h1>MCQ pipeline</h1>
    <nav>
        <a th:href="@{/}" th:classappend="${title == 'Dashboard'} ? 'on'">Dashboard</a>
        <a th:href="@{/corpus}" th:classappend="${title == 'Corpus'} ? 'on'">Corpus</a>
        <a th:href="@{/items}" th:classappend="${title == 'Items'} ? 'on'">Items</a>
        <a th:href="@{/quizzes}" th:classappend="${title == 'Quizzes'} ? 'on'">Quizzes</a>
        <a th:href="@{/plans}" th:classappend="${title == 'Plans'} ? 'on'">Plans</a>
        <a th:href="@{/export}" th:classappend="${title == 'Export'} ? 'on'">Export</a>
        <a th:href="@{/readiness}" th:classappend="${title == 'Setup'} ? 'on'">Setup</a>
    </nav>
</header>
<main>
    <div class="notice" th:if="${message}" th:text="${message}"></div>
    <div class="notice error" th:if="${error}" th:text="${error}"></div>
    <th:block th:replace="${body}"></th:block>
</main>
</body>
</html>
